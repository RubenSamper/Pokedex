<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipos</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@300;400;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d1a;
      --card: #13132a;
      --card2: #1a1a35;
      --border: #2a2a55;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --gold: #ffd700;
      --text: #e8e8ff;
      --muted: #7070aa;
      --green: #4ade80;
      --red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .back-btn {
      position: absolute;
      top: 0;
      left: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.8rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.8rem, 2.5vw, 1.2rem);
      color: var(--accent);
      text-shadow: 0 0 20px rgba(108, 99, 255, 0.5);
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.5rem 1.2rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .refresh-btn.spinning svg {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .last-update {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      align-items: start;
    }

    .player-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeIn 0.4s ease both;
    }

    .player-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(108, 99, 255, 0.15);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .player-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.2rem;
      background: var(--card2);
      border-bottom: 1px solid var(--border);
    }

    .player-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--border);
      overflow: hidden;
      flex-shrink: 0;
    }

    .player-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-name {
      font-weight: 700;
      font-size: 1rem;
      flex: 1;
    }

    .online-badge {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
    }

    .online-badge.online {
      background: rgba(74, 222, 128, 0.12);
      color: var(--green);
    }

    .online-badge.offline {
      background: rgba(248, 113, 113, 0.12);
      color: var(--red);
    }

    .online-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .online-badge.online .dot {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      padding: 1rem;
    }

    .poke-slot {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 0.4rem;
      text-align: center;
      transition: border-color 0.2s;
      cursor: default;
      position: relative;
    }

    .poke-slot:hover {
      border-color: var(--accent);
    }

    .poke-slot.empty {
      opacity: 0.3;
      min-height: 90px;
    }

    .poke-img-wrap {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.3rem;
      position: relative;
    }

    .poke-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    .shiny-star {
      position: absolute;
      top: -4px;
      right: -4px;
      font-size: 0.65rem;
    }

    .poke-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .poke-level {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .poke-hp-bar {
      height: 3px;
      background: var(--border);
      border-radius: 999px;
      margin-top: 0.4rem;
      overflow: hidden;
    }

    .poke-hp-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    .hp-high {
      background: var(--green);
    }

    .hp-mid {
      background: var(--gold);
    }

    .hp-low {
      background: var(--red);
    }

    .empty-team {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--muted);
    }

    .loading-dots span {
      display: inline-block;
      animation: bounce 1.2s infinite;
      font-size: 2rem;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(0.8);
        opacity: 0.5;
      }

      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    .error-msg {
      text-align: center;
      padding: 3rem;
      color: var(--red);
      font-size: 0.9rem;
    }

    /* Tooltip */
    .poke-slot[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e40;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: 0.65rem;
      white-space: nowrap;
      color: var(--text);
      z-index: 10;
      pointer-events: none;
    }

    /* TYPE COLORS */
    .type-badge {
      display: inline-block;
      font-size: 0.55rem;
      font-weight: 700;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 0.2rem;
    }

    .type-fire {
      background: #f08030;
      color: #fff;
    }

    .type-water {
      background: #6890f0;
      color: #fff;
    }

    .type-grass {
      background: #78c850;
      color: #fff;
    }

    .type-electric {
      background: #f8d030;
      color: #333;
    }

    .type-psychic {
      background: #f85888;
      color: #fff;
    }

    .type-ice {
      background: #98d8d8;
      color: #333;
    }

    .type-dragon {
      background: #7038f8;
      color: #fff;
    }

    .type-dark {
      background: #705848;
      color: #fff;
    }

    .type-fairy {
      background: #ee99ac;
      color: #333;
    }

    .type-normal {
      background: #a8a878;
      color: #fff;
    }

    .type-fighting {
      background: #c03028;
      color: #fff;
    }

    .type-flying {
      background: #a890f0;
      color: #fff;
    }

    .type-poison {
      background: #a040a0;
      color: #fff;
    }

    .type-ground {
      background: #e0c068;
      color: #333;
    }

    .type-rock {
      background: #b8a038;
      color: #fff;
    }

    .type-bug {
      background: #a8b820;
      color: #fff;
    }

    .type-ghost {
      background: #705898;
      color: #fff;
    }

    .type-steel {
      background: #b8b8d0;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="header" style="position:relative">
    <a href="index.html" class="back-btn" title="Volver a la Pokédex">← Volver</a>
    <h1>⚔ EQUIPOS</h1>
    <p>La casa del Girona — Cobblemon 1.21.1</p>
    <button class="refresh-btn" onclick="loadTeams(true)" id="refreshBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6M1 20v-6h6" />
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
      </svg>
      Actualizar
    </button>
    <span class="last-update" id="lastUpdate"></span>
  </div>

  <div id="root"></div>

  <script>
    const SERVER_ID = '6a16d56a9bd4b6296506e1d7';

    /**
     * ── CONFIGURACIÓN DEL PROXY CORS ─────────────────────────────────
     *
     * LOCAL  → node proxy-server.js
     *   Deja PROXY_BASE vacío. El proxy sirve HTML + /api/players en localhost:3000.
     *
     * PRODUCCIÓN (GitHub Pages) → Cloudflare Worker
     *   1. Despliega _worker.js en Cloudflare Workers (gratis)
     *   2. Copias aquí la URL (ej: "https://pokedex-proxy.tu-usuario.workers.dev")
     *   3. La página en GitHub Pages llamará a ese worker como proxy
     */
    const PROXY_BASE = 'https://gentle-sea-9ea3.rubensampercruz123.workers.dev';
    const API_URL = PROXY_BASE
      ? `${PROXY_BASE}/api/players`
      : `/api/players`;

    // Tipos de Pokémon desde PokeAPI (caché local)
    const typeCache = {};

    async function getPokemonData(name) {
      const key = name.toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (typeCache[key]) return typeCache[key];
      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${key}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const result = {
          types: data.types.map(t => t.type.name),
          sprite: data.sprites.front_default,
          id: data.id
        };
        typeCache[key] = result;
        return result;
      } catch {
        return { types: [], sprite: null, id: null };
      }
    }

    function getSpriteUrl(pokemonName, isShiny = false, dexNumber = null) {
      // Si tenemos el número de Dex, úsalo directamente (evita depender de PokeAPI)
      if (dexNumber) {
        if (isShiny) return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${dexNumber}.png`;
        return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${dexNumber}.png`;
      }
      // Fallback: lookup por nombre
      const key = pokemonName.toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (typeCache[key]?.id) {
        const id = typeCache[key].id;
        if (isShiny) return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${id}.png`;
        return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
      }
      return `https://img.pokemondb.net/sprites/sword-shield/icon/${key}.png`;
    }

    function getHpClass(pct) {
      if (pct > 50) return 'hp-high';
      if (pct > 20) return 'hp-mid';
      return 'hp-low';
    }

    function capitalize(s) {
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
    }

    function normalizePlayersResponse(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.players)) return data.players;
      if (data && data.players && typeof data.players === 'object') return Object.values(data.players);
      if (data && Array.isArray(data.data)) return data.data;
      return [];
    }

    /**
     * Obtiene el nombre limpio de un Pokémon desde el objeto party.
     * La API devuelve Species con prefijo "cobblemon:" y en PascalCase.
     */
    function getSpeciesName(pk) {
      const raw = pk.Species || pk.species || pk.name || pk.pokemon || '';
      // Si tiene namespace ("cobblemon:primarina"), lo quitamos
      if (raw.includes(':')) return raw.split(':')[1];
      return raw;
    }

    /**
     * Obtiene los tipos en minúscula desde la respuesta del API.
     * La API ya devuelve Type1/Type2 directamente.
     */
    function getApiTypes(pk) {
      const types = [];
      if (pk.Type1) types.push(pk.Type1.toLowerCase());
      if (pk.Type2 && pk.Type2.toLowerCase() !== (pk.Type1 || '').toLowerCase()) {
        types.push(pk.Type2.toLowerCase());
      }
      return types;
    }

    async function renderTeams(data) {
      const root = document.getElementById('root');

      if (!data || data.length === 0) {
        root.innerHTML = `<div class="error-msg">No hay jugadores con Showcase activo aún.<br><small style="color:var(--muted)">Pide a tus amigos que ejecuten /showcase on</small></div>`;
        return;
      }

      // NOTA: ya no pre-fetchamos tipos desde PokeAPI,
      // porque la API de Cobblemon ya incluye Type1/Type2 y DexNumber.

      const grid = document.createElement('div');
      grid.className = 'grid';

      for (const player of data) {
        const party = player.party || player.pokemon || player.team || [];
        // El API no devuelve campo "online"; si no está presente asumimos true
        const isOnline = player.online !== false;
        const username = player.username || player.player || player.name || 'Jugador';

        const card = document.createElement('div');
        card.className = 'player-card';
        card.style.animationDelay = `${data.indexOf(player) * 0.08}s`;

        // Header
        const avatarUrl = `https://mc-heads.net/avatar/${username}/36`;
        card.innerHTML = `
      <div class="player-header">
        <div class="player-avatar">
          <img src="${avatarUrl}" alt="${username}" onerror="this.src='https://mc-heads.net/avatar/steve/36'">
        </div>
        <span class="player-name">${username}</span>
        <span class="online-badge ${isOnline ? 'online' : 'offline'}">
          <span class="dot"></span>${isOnline ? 'Online' : 'Offline'}
        </span>
      </div>
    `;

        // Team
        if (party.length === 0) {
          card.innerHTML += `<div class="empty-team">Sin Pokémon en el equipo</div>`;
        } else {
          const teamGrid = document.createElement('div');
          teamGrid.className = 'team-grid';

          // Siempre 6 slots
          for (let i = 0; i < 6; i++) {
            const slot = document.createElement('div');
            slot.className = 'poke-slot';

        if (i < party.length && party[i] != null) {
          const pk = party[i];

          // Guardamos datos para el modal de detalle
          slot._pkData = pk;
          slot.style.cursor = 'pointer';

          // ── Mapeo de campos (API usa PascalCase) ──────────
              const pkName = getSpeciesName(pk) || 'unknown';
              const pkLevel = pk.Level ?? pk.level ?? pk.lvl ?? '?';
              const isShiny = pk.Shiny ?? pk.shiny ?? false;
              const dexNumber = pk.DexNumber ?? pk.dexNumber ?? null;
              const currentHp = pk.Health ?? pk.currentHealth ?? pk.hp ?? pk.currentHp ?? null;
              // El API no expone MaxHealth; lo dejamos como null para no mostrar barra de HP vacía
              const maxHp = pk.MaxHealth ?? pk.maxHealth ?? pk.maxHp ?? null;
              const hpPct = (currentHp !== null && maxHp) ? Math.round((currentHp / maxHp) * 100) : 100;

              // Usamos Type1/Type2 de la API directamente (evita llamada a PokeAPI)
              const types = getApiTypes(pk);

              // Sprite con DexNumber si está disponible
              const spriteUrl = getSpriteUrl(pkName, isShiny, dexNumber);

              const tipText = `Nv.${pkLevel}${isShiny ? ' ✨' : ''}${currentHp !== null ? ` · ${currentHp}${maxHp ? '/' + maxHp : ''} HP` : ''}`;
              slot.setAttribute('data-tip', tipText);

              slot.innerHTML = `
            <div class="poke-img-wrap">
              <img src="${spriteUrl}" alt="${pkName}" onerror="this.style.opacity='0.3'">
              ${isShiny ? '<span class="shiny-star">✨</span>' : ''}
            </div>
            <div class="poke-name">${capitalize(pkName)}</div>
            <div class="poke-level">Nv. ${pkLevel}</div>
            ${types.length ? `<span class="type-badge type-${types[0]}">${types[0]}</span>` : ''}
            ${currentHp !== null && maxHp ? `
              <div class="poke-hp-bar">
                <div class="poke-hp-fill ${getHpClass(hpPct)}" style="width:${hpPct}%"></div>
              </div>
            ` : ''}
          `;
            } else {
              slot.classList.add('empty');
              slot.innerHTML = `<div style="height:56px;width:56px;margin:0 auto"></div>`;
            }

            teamGrid.appendChild(slot);
          }

          card.appendChild(teamGrid);

          // ── Botón de análisis de equipo ──
          const analysisBtn = document.createElement('button');
          analysisBtn.className = 'team-analysis-btn';
          analysisBtn.textContent = '📊 Análisis';
          analysisBtn.onclick = function() {
            const panel = card.querySelector('.team-analysis-panel');
            const isOpening = !panel.classList.contains('open');
            // Cerrar cualquier otro análisis abierto
            document.querySelectorAll('.team-analysis-panel.open').forEach(p => {
              if (p !== panel) {
                p.classList.remove('open');
                const btn = p.closest('.player-card')?.querySelector('.team-analysis-btn');
                if (btn) btn.textContent = '📊 Análisis';
              }
            });
            if (isOpening) {
              panel.classList.add('open');
              analysisBtn.textContent = '📊 Cerrar';
              if (!panel.innerHTML) {
                panel.innerHTML = '<div class="analysis-loading">Analizando...</div>';
                setTimeout(() => renderTeamAnalysis(panel, party.filter(p => p != null)), 50);
              }
            } else {
              panel.classList.remove('open');
              analysisBtn.textContent = '📊 Análisis';
            }
          };
          card.appendChild(analysisBtn);

          // Panel de análisis (oculto por defecto)
          const analysisPanel = document.createElement('div');
          analysisPanel.className = 'team-analysis-panel';
          card.appendChild(analysisPanel);
        }

        grid.appendChild(card);
      }

      root.innerHTML = '';
      root.appendChild(grid);
    }

    // ── Análisis de equipo (detallado por Pokémon) ──
    function renderTeamAnalysis(panel, party) {
      const activeParty = party.filter(p => p != null);
      const partySize = activeParty.length;
      const allTypes = Object.keys(TYPE_EFFECTS);

      // Estructuras detalladas: tipo → lista de { nombre, porTipo }
      const weakDetail = {};   // tipo atacante → [{ name, porType }]
      const resistDetail = {};
      const immuneDetail = {};
      const moveCoverage = {}; // tipo movimiento → [name]

      for (const pk of activeParty) {
        const name = capitalize(getSpeciesName(pk) || '??');
        const types = getApiTypes(pk);
        const moves = pk.MoveSet ? Object.values(pk.MoveSet).filter(m => m.MoveName) : [];

        // Defensa: para cada tipo del Pokémon, acumula cómo afecta a cada tipo atacante
        for (const defenderType of types) {
          const eff = TYPE_EFFECTS[defenderType];
          if (!eff) continue;
          // Débil a:
          for (const atkType of eff.weak) {
            if (!weakDetail[atkType]) weakDetail[atkType] = [];
            if (!weakDetail[atkType].some(p => p.name === name)) {
              weakDetail[atkType].push({ name, via: defenderType });
            }
          }
          // Resistente a:
          for (const atkType of eff.resist) {
            if (!resistDetail[atkType]) resistDetail[atkType] = [];
            if (!resistDetail[atkType].some(p => p.name === name)) {
              resistDetail[atkType].push({ name, via: defenderType });
            }
          }
          // Inmune a:
          for (const atkType of eff.immune) {
            if (!immuneDetail[atkType]) immuneDetail[atkType] = [];
            if (!immuneDetail[atkType].some(p => p.name === name)) {
              immuneDetail[atkType].push({ name, via: defenderType });
            }
          }
        }

        // Ofensiva: movimientos
        for (const m of moves) {
          if (m.MoveType) {
            const mt = m.MoveType.toLowerCase();
            if (!moveCoverage[mt]) moveCoverage[mt] = [];
            if (!moveCoverage[mt].includes(name)) {
              moveCoverage[mt].push(name);
            }
          }
        }
      }

      // Clasificar y ordenar
      const weaknesses = Object.entries(weakDetail)
        .map(([type, pks]) => ({ type, count: pks.length, pks }))
        .filter(w => w.count >= 2)
        .sort((a,b) => b.count - a.count);

      const resistances = Object.entries(resistDetail)
        .map(([type, pks]) => ({ type, count: pks.length, pks }))
        .filter(r => r.count >= 2)
        .sort((a,b) => b.count - a.count);

      const immunities = Object.entries(immuneDetail)
        .map(([type, pks]) => ({ type, count: pks.length, pks }))
        .filter(i => i.count > 0)
        .sort((a,b) => b.count - a.count);

      const coverage = Object.entries(moveCoverage)
        .map(([type, pks]) => ({ type, count: pks.length, pks }))
        .sort((a,b) => b.count - a.count);

      // Métricas de resumen
      const criticalWeak = weaknesses.filter(w => w.count >= 3);
      const hasGoodResists = resistances.length >= 3;
      const manyWeaknesses = weaknesses.length >= 3;
      const hasImmunity = immunities.length > 0;
      const goodCoverage = coverage.length >= 6;

      let html = '';

      // ── Resumen ──
      html += `<div class="analysis-summary">`;
      const summaries = [];
      if (criticalWeak.length) {
        summaries.push(`<span style="color:#f87171">🔴 Crítico: ${criticalWeak.length} tipo(s) de ataque que afectan a 3+ Pokémon</span>`);
      }
      if (manyWeaknesses && criticalWeak.length !== weaknesses.length) {
        summaries.push(`<span style="color:#fb923c">🟡 Precaución: ${weaknesses.length} tipos de golpe son débiles para 2+ Pokémon</span>`);
      }
      if (hasGoodResists) {
        summaries.push(`<span style="color:#4ade80">🟢 Sólido: ${resistances.length} tipos son resistidos por 2+ Pokémon</span>`);
      }
      if (hasImmunity) {
        summaries.push(`<span style="color:#a78bfa">🟣 Inmunidad: ${immunities.length} tipo(s) anulado(s) por completo</span>`);
      }
      if (goodCoverage) {
        summaries.push(`<span style="color:#60a5fa">🔵 Cobertura: ${coverage.length} tipos distintos en movimientos</span>`);
      }
      if (!summaries.length) html += `<span style="color:var(--muted)">Equipo equilibrado sin puntos destacables</span>`;
      else html += summaries.join('');
      html += `</div>`;

      // ── Debilidades (detalle) ──
      html += `<div class="analysis-section">
        <div class="analysis-section-title" style="color:#f87171">😰 Debilidades <span style="font-weight:400;font-size:0.65rem;color:var(--muted)">(tipos de ataque que hieren a 2+ Pokémon)</span></div>`;
      if (weaknesses.length) {
        html += weaknesses.map(w => {
          const isCritical = w.count >= 3;
          const borderStyle = isCritical ? 'border-left:3px solid #f87171;padding-left:0.5rem' : '';
          return `<div class="analysis-detail-row" style="${borderStyle}">
            <div class="analysis-detail-head">
              <span class="type-badge type-${w.type}">${w.type}</span>
              <span class="analysis-count">${w.count}/${partySize} Pokémon</span>
              ${isCritical ? '<span style="color:#f87171;font-size:0.6rem;font-weight:700">⚠️ CRÍTICO</span>' : ''}
            </div>
            <div class="analysis-pokemon-list">
              ${w.pks.map(p => `<span class="analysis-pokemon-tag" style="color:#f87171">${p.name} <span style="color:var(--muted);font-size:0.55rem">(vía ${p.via})</span></span>`).join('')}
            </div>
          </div>`;
        }).join('');
      } else {
        html += `<div style="color:var(--muted);font-size:0.75rem;padding:0.3rem 0">Ninguna debilidad colectiva destacable ✅</div>`;
      }
      html += `</div>`;

      // ── Resistencias (detalle) ──
      html += `<div class="analysis-section">
        <div class="analysis-section-title" style="color:#4ade80">💪 Resistencias <span style="font-weight:400;font-size:0.65rem;color:var(--muted)">(tipos que 2+ Pokémon resisten)</span></div>`;
      if (resistances.length) {
        html += resistances.map(r =>
          `<div class="analysis-detail-row">
            <div class="analysis-detail-head">
              <span class="type-badge type-${r.type}">${r.type}</span>
              <span class="analysis-count">${r.count}/${partySize} Pokémon</span>
            </div>
            <div class="analysis-pokemon-list">
              ${r.pks.map(p => `<span class="analysis-pokemon-tag" style="color:#4ade80">${p.name} <span style="color:var(--muted);font-size:0.55rem">(vía ${p.via})</span></span>`).join('')}
            </div>
          </div>`
        ).join('');
      } else {
        html += `<div style="color:var(--muted);font-size:0.75rem;padding:0.3rem 0">Sin resistencias colectivas destacables</div>`;
      }
      html += `</div>`;

      // ── Inmunidades ──
      if (immunities.length) {
        html += `<div class="analysis-section">
          <div class="analysis-section-title" style="color:#a78bfa">🚫 Inmunidades</div>`;
        html += immunities.map(im =>
          `<div class="analysis-detail-row">
            <div class="analysis-detail-head">
              <span class="type-badge type-${im.type}">${im.type}</span>
              <span class="analysis-count">${im.count}/${partySize} Pokémon</span>
            </div>
            <div class="analysis-pokemon-list">
              ${im.pks.map(p => `<span class="analysis-pokemon-tag" style="color:#a78bfa">${p.name} <span style="color:var(--muted);font-size:0.55rem">(vía ${p.via})</span></span>`).join('')}
            </div>
          </div>`
        ).join('');
        html += `</div>`;
      }

      // ── Cobertura ofensiva ──
      html += `<div class="analysis-section">
        <div class="analysis-section-title" style="color:#60a5fa">⚔ Cobertura ofensiva <span style="font-weight:400;font-size:0.65rem;color:var(--muted)">(tipos de movimiento disponibles)</span></div>`;
      if (coverage.length) {
        html += coverage.map(c =>
          `<div class="analysis-detail-row">
            <div class="analysis-detail-head">
              <span class="type-badge type-${c.type}">${c.type}</span>
              <span class="analysis-count">${c.count} Pokémon</span>
            </div>
            <div class="analysis-pokemon-list">
              ${c.pks.map(p => `<span class="analysis-pokemon-tag" style="color:#60a5fa">${p}</span>`).join('')}
            </div>
          </div>`
        ).join('');
      } else {
        html += `<div style="color:var(--muted);font-size:0.75rem;padding:0.3rem 0">Sin datos de movimientos</div>`;
      }
      html += `</div>`;

      // Tipos sin cobertura
      const coveredTypes = coverage.map(c => c.type);
      const missing = allTypes.filter(t => !coveredTypes.includes(t));
      if (missing.length > 0 && missing.length < 18) {
        html += `<div class="analysis-missing-cover">
          <div class="analysis-section-title">💡 Tipos sin cobertura ofensiva</div>
          <div class="analysis-tags">${missing.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('')}</div>
        </div>`;
      }

      panel.innerHTML = html;
    }

    async function loadTeams(manual = false) {
      const btn = document.getElementById('refreshBtn');
      const root = document.getElementById('root');

      btn.classList.add('spinning');

      if (!root.querySelector('.grid')) {
        root.innerHTML = `
      <div class="loading">
        <div class="loading-dots">
          <span>●</span><span>●</span><span>●</span>
        </div>
        <p style="margin-top:1rem;font-size:0.8rem">Cargando equipos...</p>
      </div>`;
      }

      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        console.log('CobblemonExtras API response:', data);

        const players = normalizePlayersResponse(data);
        await renderTeams(players);

        const now = new Date();
        document.getElementById('lastUpdate').textContent =
          `Última actualización: ${now.toLocaleTimeString('es-ES')}`;
      } catch (err) {
        console.error('Error fetching teams:', err);
        root.innerHTML = `
      <div class="error-msg">
        ❌ No se pudieron cargar los equipos<br>
        <small style="color:var(--muted);display:block;margin-top:0.5rem">${err.message}</small>
        <small style="color:var(--muted)">Comprueba la consola del navegador para más detalles</small>
      </div>`;
      } finally {
        btn.classList.remove('spinning');
      }
    }

    // Carga inicial
    loadTeams();
    // Auto-refresh cada 2 minutos
    setInterval(() => loadTeams(), 2 * 60 * 1000);

    // ═══════════════════════════════════════════════════════════════
    //  MODAL DE DETALLE DE POKÉMON
    // ═══════════════════════════════════════════════════════════════

    const TYPE_EFFECTS = {
      normal:   { weak:["fighting"],resist:[],immune:["ghost"] },
      fire:     { weak:["water","ground","rock"],resist:["fire","grass","ice","bug","steel","fairy"],immune:[] },
      water:    { weak:["electric","grass"],resist:["fire","water","ice","steel"],immune:[] },
      electric: { weak:["ground"],resist:["electric","flying","steel"],immune:[] },
      grass:    { weak:["fire","ice","poison","flying","bug"],resist:["water","electric","grass","ground"],immune:[] },
      ice:      { weak:["fire","fighting","rock","steel"],resist:["ice"],immune:[] },
      fighting: { weak:["flying","psychic","fairy"],resist:["bug","rock","dark"],immune:[] },
      poison:   { weak:["ground","psychic"],resist:["grass","fighting","poison","bug","fairy"],immune:[] },
      ground:   { weak:["water","grass","ice"],resist:["poison","rock"],immune:["electric"] },
      flying:   { weak:["electric","ice","rock"],resist:["grass","fighting","bug"],immune:["ground"] },
      psychic:  { weak:["bug","ghost","dark"],resist:["fighting","psychic"],immune:[] },
      bug:      { weak:["fire","flying","rock"],resist:["grass","fighting","ground"],immune:[] },
      rock:     { weak:["water","grass","fighting","ground","steel"],resist:["normal","fire","poison","flying"],immune:[] },
      ghost:    { weak:["ghost","dark"],resist:["poison","bug"],immune:["normal","fighting"] },
      dragon:   { weak:["ice","dragon","fairy"],resist:["fire","water","electric","grass"],immune:[] },
      dark:     { weak:["fighting","bug","fairy"],resist:["ghost","dark"],immune:["psychic"] },
      steel:    { weak:["fire","fighting","ground"],resist:["normal","grass","ice","flying","psychic","bug","rock","dragon","steel","fairy"],immune:["poison"] },
      fairy:    { weak:["poison","steel"],resist:["fighting","bug","dark"],immune:["dragon"] }
    };

    const STAT_NAMES = { hp:"PS",attack:"Ataque",defense:"Defensa","special-attack":"At.Esp","special-defense":"Def.Esp",speed:"Velocidad" };
    const STAT_COLORS = { hp:"#4ade80",attack:"#f87171",defense:"#facc15","special-attack":"#60a5fa","special-defense":"#a78bfa",speed:"#34d399" };
    const STAT_MAX = { hp:255,attack:255,defense:255,"special-attack":255,"special-defense":255,speed:255 };

    const NATURE_MAP = {
      "hardy":{},"lonely":{up:"attack",down:"defense"},"brave":{up:"attack",down:"speed"},"adamant":{up:"attack",down:"special-attack"},"naughty":{up:"attack",down:"special-defense"},"bold":{up:"defense",down:"attack"},
      "docile":{},"relaxed":{up:"defense",down:"speed"},"impish":{up:"defense",down:"special-attack"},"lax":{up:"defense",down:"special-defense"},"timid":{up:"speed",down:"attack"},
      "hasty":{up:"speed",down:"defense"},"serious":{},"jolly":{up:"speed",down:"special-attack"},"naive":{up:"speed",down:"special-defense"},"modest":{up:"special-attack",down:"attack"},
      "mild":{up:"special-attack",down:"defense"},"quiet":{up:"special-attack",down:"speed"},"bashful":{},"rash":{up:"special-attack",down:"special-defense"},"calm":{up:"special-defense",down:"attack"},
      "gentle":{up:"special-defense",down:"defense"},"sassy":{up:"special-defense",down:"speed"},"careful":{up:"special-defense",down:"special-attack"},"quirky":{}
    };

    // Mapeo de nombres Cobblemon → PokeAPI
    function cobStat(name) {
      const map = { hp:"hp",attack:"attack",defence:"defense",special_attack:"special-attack",special_defence:"special-defense",speed:"speed" };
      return map[name.replace('cobblemon:','')] || name;
    }

    function calcStat(base, iv, ev, level, natureMult = 1) {
      return Math.floor((Math.floor((2 * base + iv + Math.floor(ev / 4)) * level / 100) + 5) * natureMult);
    }
    function calcHP(base, iv, ev, level) {
      return Math.floor((2 * base + iv + Math.floor(ev / 4)) * level / 100) + level + 10;
    }

    let detailModal = null;
    let detailData = null;

    function getEffectiveness(types) {
      const defs = { weak:{}, resist:{}, immune:[] };
      for (const t of types) {
        const e = TYPE_EFFECTS[t];
        if (!e) continue;
        for (const w of e.weak) defs.weak[w] = (defs.weak[w]||0) + 1;
        for (const r of e.resist) defs.resist[r] = (defs.resist[r]||0) + 1;
        for (const i of e.immune) if (!defs.immune.includes(i)) defs.immune.push(i);
      }
      // Calcular efectividad neta
      const result = [];
      const allTypes = Object.keys(TYPE_EFFECTS);
      for (const t of allTypes) {
        if (defs.immune.includes(t)) continue;
        let mult = 1;
        mult *= (defs.weak[t]||0) * 2;
        mult /= Math.pow(2, defs.resist[t]||0);
        if (mult > 1) result.push({ type: t, mult, label: mult >= 4 ? '4×' : '2×', cls: 'weak' });
        else if (mult < 1) result.push({ type: t, mult, label: mult <= 0.25 ? '¼×' : '½×', cls: 'resist' });
      }
      return result.sort((a,b) => b.mult - a.mult);
    }

    function extractIV(pk, stat) {
      const ivs = pk.IVs?.Base || pk.ivs || {};
      const val = ivs[`cobblemon:${stat}`] ?? ivs[stat] ?? 0;
      return typeof val === 'number' ? val : 0;
    }
    function extractEV(pk, stat) {
      const evs = pk.EVs || pk.evs || {};
      const val = evs[`cobblemon:${stat}`] ?? evs[stat] ?? 0;
      return typeof val === 'number' ? val : 0;
    }

    // Orden de stats para mostrar
    const STAT_ORDER = ['hp','attack','defense','special-attack','special-defense','speed'];
    const COB_STAT_MAP = { hp:'hp', attack:'attack', defense:'defence', 'special-attack':'special_attack', 'special-defense':'special_defence', speed:'speed' };

    async function showPokemonDetail(pk) {
      const pkName = getSpeciesName(pk);
      const dexNum = pk.DexNumber ?? pk.dexNumber ?? null;
      const types = getApiTypes(pk);
      const level = pk.Level ?? pk.level ?? 50;
      const isShiny = pk.Shiny ?? pk.shiny ?? false;
      const abilityName = pk.Ability?.AbilityName || '';
      const rawNature = pk.Nature || '';
      const natureKey = rawNature.toLowerCase();
      const natureEffect = NATURE_MAP[natureKey] || {};
      const moves = pk.MoveSet ? Object.values(pk.MoveSet).filter(m => m.MoveName) : [];
      const spriteUrl = getSpriteUrl(pkName, isShiny, dexNum);
      const currentHp = pk.Health ?? null;

      // Crear o reusar modal
      if (!detailModal) {
        detailModal = document.createElement('div');
        detailModal.className = 'detail-modal-overlay';
        detailModal.addEventListener('click', e => { if (e.target === detailModal) closeDetail(); });
        document.body.appendChild(detailModal);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
      }

      detailModal.innerHTML = `
        <div class="detail-modal">
          <div class="detail-header">
            <span class="detail-close" onclick="closeDetail()">&times;</span>
          </div>
          <div class="detail-body">
            <div class="detail-main">
              <div class="detail-sprite-section">
                <div class="detail-sprite-wrap">
                  <img src="${spriteUrl}" alt="${pkName}" onerror="this.style.opacity='0.3'" class="detail-sprite">
                  ${isShiny ? '<span class="shiny-star" style="font-size:1.4rem;position:absolute;top:-4px;right:-4px">✨</span>' : ''}
                </div>
                <div class="detail-name">${capitalize(pkName)}${dexNum ? ` <span class="detail-dex">#${dexNum}</span>` : ''}</div>
                <div class="detail-level">Nv. ${level}</div>
                <div class="detail-types">
                  ${types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('')}
                </div>
                <div class="detail-meta">
                  ${abilityName ? `<div class="detail-meta-item"><span class="detail-meta-label">Habilidad</span><span>${abilityName}</span></div>` : ''}
                  ${rawNature ? `<div class="detail-meta-item"><span class="detail-meta-label">Naturaleza</span><span>${rawNature}${natureEffect.up ? ' <span style="color:#4ade80">↑' + (STAT_NAMES[natureEffect.up]||natureEffect.up) + '</span>' : ''}${natureEffect.down ? ' <span style="color:#f87171">↓' + (STAT_NAMES[natureEffect.down]||natureEffect.down) + '</span>' : ''}</span></div>` : ''}
                  ${currentHp !== null ? `<div class="detail-meta-item"><span class="detail-meta-label">PS actual</span><span>${currentHp}</span></div>` : ''}
                </div>
              </div>
              <div class="detail-stats-section">
                <h3>Stats Reales <span style="font-weight:400;font-size:0.7rem;color:var(--muted)">(calculados con IVs/EVs/Naturaleza)</span></h3>
                <div id="detailStats"><div class="detail-loading">Calculando stats reales...</div></div>
                <h3 style="margin-top:1.2rem">Efectividad</h3>
                <div id="detailEffectiveness"><div class="detail-loading">Calculando...</div></div>
              </div>
            </div>
            ${moves.length ? `
            <div class="detail-moves-section">
              <h3>Movimientos</h3>
              <div class="detail-moves-grid">
                ${moves.map(m => `
                  <div class="detail-move">
                    <span class="detail-move-name">${m.MoveName.replace(/-/g,' ')}</span>
                    ${m.MoveType ? `<span class="type-badge type-${m.MoveType.toLowerCase()}">${m.MoveType}</span>` : ''}
                    ${m.MovePP ? `<span class="detail-move-pp">PP ${m.MovePP}</span>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>` : ''}
          </div>
        </div>
      `;

      detailModal.classList.remove('oculto');

      const statsContainer = document.getElementById('detailStats');
      const effContainer = document.getElementById('detailEffectiveness');

      // Cargar base stats desde PokeAPI y calcular stats reales
      if (dexNum) {
        try {
          const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${dexNum}`);
          if (res.ok) {
            const data = await res.json();
            detailData = data;

            // Calcular stats reales
            const statRows = STAT_ORDER.map(s => {
              const baseStat = data.stats.find(st => st.stat.name === s)?.base_stat || 50;
              const cobStatName = COB_STAT_MAP[s];
              const iv = extractIV(pk, cobStatName);
              const ev = extractEV(pk, cobStatName);

              let actual, maxPossible;
              if (s === 'hp') {
                actual = calcHP(baseStat, iv, ev, level);
                maxPossible = calcHP(baseStat, 31, 252, level);
              } else {
                const natureMult = natureEffect.up === s ? 1.1 : natureEffect.down === s ? 0.9 : 1;
                actual = calcStat(baseStat, iv, ev, level, natureMult);
                maxPossible = calcStat(baseStat, 31, 252, level, natureEffect.up === s ? 1.1 : 1);
              }

              const pct = Math.min((actual / maxPossible) * 100, 100);
              const color = STAT_COLORS[s] || '#888';
              const natureArrow = natureEffect.up === s ? ' ↑' : natureEffect.down === s ? ' ↓' : '';

              return {
                name: (STAT_NAMES[s] || s) + natureArrow,
                actual,
                maxPossible,
                pct,
                color,
                base: baseStat,
                iv,
                ev
              };
            });

            statsContainer.innerHTML = statRows.map(r => `
              <div class="detail-stat-row">
                <span class="detail-stat-label">${r.name}</span>
                <div class="detail-stat-bar-wrap">
                  <div class="detail-stat-bar"><div class="detail-stat-fill" style="width:${r.pct}%;background:${r.color}"></div></div>
                  <div class="detail-stat-sub">Base ${r.base} · IV ${r.iv} · EV ${r.ev}</div>
                </div>
                <span class="detail-stat-val">${r.actual}</span>
              </div>
            `).join('');

          } else {
            statsContainer.innerHTML = '<div class="detail-loading" style="color:var(--muted)">Stats no disponibles</div>';
          }
        } catch {
          statsContainer.innerHTML = '<div class="detail-loading" style="color:var(--muted)">Error al cargar stats</div>';
        }
      } else {
        statsContainer.innerHTML = '<div class="detail-loading" style="color:var(--muted)">Stats no disponibles</div>';
      }

      // Mostrar efectividad
      if (types.length) {
        const eff = getEffectiveness(types);
        const weak = eff.filter(e => e.cls === 'weak');
        const resist = eff.filter(e => e.cls === 'resist');
        let html = '';
        if (weak.length) {
          html += `<div class="eff-section"><span class="eff-label">Débil a:</span> ${weak.slice(0,8).map(e => `<span class="type-badge type-${e.type} eff-${e.cls}">${e.label}</span>`).join(' ')}</div>`;
        } else {
          html += `<div class="eff-section" style="color:var(--muted)">Sin debilidades destacadas</div>`;
        }
        if (resist.length) {
          html += `<div class="eff-section" style="margin-top:6px"><span class="eff-label">Resiste:</span> ${resist.slice(0,8).map(e => `<span class="type-badge type-${e.type} eff-${e.cls}">${e.label}</span>`).join(' ')}</div>`;
        }
        effContainer.innerHTML = html;
      } else {
        effContainer.innerHTML = '<div class="detail-loading" style="color:var(--muted)">Sin datos de tipos</div>';
      }
    }

    function closeDetail() {
      if (detailModal) detailModal.classList.add('oculto');
    }

    // Enlazar clicks en los slots
    document.addEventListener('click', e => {
      const slot = e.target.closest('.poke-slot:not(.empty)');
      if (slot && slot._pkData) {
        showPokemonDetail(slot._pkData);
      }
    });
  </script>

      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border, #2a2a55);
    }
    .detail-sprite { width: 110px; height: 110px; object-fit: contain; image-rendering: pixelated; }
    .detail-name { font-weight: 700; font-size: 1rem; margin-bottom: 0.2rem; }
    .detail-dex { color: var(--muted, #7070aa); font-weight: 400; font-size: 0.8rem; }
    .detail-level { font-size: 0.8rem; color: var(--muted, #7070aa); margin-bottom: 0.5rem; }
    .detail-types { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-bottom: 0.6rem; }
    .detail-meta { display: grid; gap: 4px; font-size: 0.78rem; }
    .detail-meta-item { display: flex; justify-content: space-between; gap: 6px; }
    .detail-meta-label { color: var(--muted, #7070aa); }

    .detail-stats-section h3, .detail-moves-section h3 {
      font-size: 0.85rem;
      font-weight: 700;
      margin: 0 0 0.5rem;
      color: var(--text, #e8e8ff);
    }
    .detail-stat-row {
      display: grid;
      grid-template-columns: 68px 1fr 36px;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 0.75rem;
    }
    .detail-stat-label { color: var(--muted, #7070aa); text-align: right; font-weight: 600; white-space: nowrap; }
    .detail-stat-bar-wrap { display: flex; flex-direction: column; gap: 1px; }
    .detail-stat-bar {
      height: 14px;
      background: var(--border, #2a2a55);
      border-radius: 999px;
      overflow: hidden;
    }
    .detail-stat-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
    .detail-stat-sub { font-size: 0.58rem; color: var(--muted, #7070aa); opacity: 0.7; }
    .detail-stat-val { font-weight: 700; font-size: 0.82rem; text-align: right; }

    .detail-loading { font-size: 0.78rem; color: var(--muted, #7070aa); padding: 0.5rem 0; }

    .eff-section { font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .eff-label { color: var(--muted, #7070aa); font-weight: 600; margin-right: 2px; }
    .eff-section .type-badge { font-size: 1.3rem; padding: 0.35rem 0.85rem; opacity: 0.95; font-weight: 800; }
    .eff-weak { box-shadow: inset 0 0 0 2.5px #f87171; }
    .eff-resist { box-shadow: inset 0 0 0 2.5px #4ade80; }

    .detail-moves-section { margin-top: 1rem; }
    .detail-moves-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .detail-move {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.4rem 0.6rem;
      background: var(--card2, #1a1a35);
      border: 1px solid var(--border, #2a2a55);
      border-radius: 10px;
      font-size: 0.72rem;
    }
    .detail-move-name { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-move .type-badge { font-size: 0.55rem; padding: 0.05rem 0.3rem; }
    .detail-move-pp { color: var(--muted, #7070aa); font-size: 0.65rem; white-space: nowrap; }

    /* ── Análisis de equipo ── */
    .team-analysis-btn {
      display: block;
      width: calc(100% - 2rem);
      margin: 0.5rem 1rem 0;
      padding: 0.45rem 0;
      background: linear-gradient(135deg, var(--card2, #1a1a35), rgba(108,99,255,0.06));
      border: 1px solid var(--border, #2a2a55);
      border-radius: 999px;
      color: var(--muted, #7070aa);
      font-family: 'Outfit', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.25s;
    }
    .team-analysis-btn:hover {
      border-color: var(--accent, #6c63ff);
      color: #fff;
      background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(108,99,255,0.05));
      box-shadow: 0 0 20px rgba(108,99,255,0.08);
    }
    .team-analysis-panel {
      display: none;
      padding: 0;
      border-top: 1px solid var(--border, #2a2a55);
      margin-top: 0.5rem;
      background: rgba(0,0,0,0.06);
      animation: fadeSlideIn 0.3s ease;
    }
    .team-analysis-panel.open { display: block; }
    @keyframes fadeSlideIn {
      from { opacity: 0; max-height: 0; }
      to   { opacity: 1; max-height: 2000px; }
    }

    .analysis-loading {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      padding: 1.5rem 1rem;
      background: rgba(0,0,0,0.04);
    }

    .analysis-summary {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 0.7rem 1rem 0.5rem;
      font-size: 0.68rem;
    }
    .analysis-summary span {
      padding: 0.35rem 0.6rem;
      background: rgba(0,0,0,0.07);
      border-radius: 10px;
      border-left: 3px solid transparent;
      backdrop-filter: blur(2px);
    }
    .analysis-summary span:first-child { margin-top: 0; }

    .analysis-section {
      margin: 0 0.6rem 0.7rem;
      background: rgba(0,0,0,0.04);
      border-radius: 14px;
      padding: 0.6rem 0.7rem;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .analysis-section-title {
      font-weight: 700;
      font-size: 0.72rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }
    .analysis-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .analysis-tags .type-badge {
      font-size: 0.6rem;
      padding: 0.1rem 0.45rem;
    }

    .analysis-count {
      color: var(--muted);
      white-space: nowrap;
      font-size: 0.6rem;
      font-weight: 500;
    }

    .analysis-detail-row {
      margin-bottom: 5px;
      padding: 0.4rem 0.55rem;
      background: rgba(0,0,0,0.12);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.03);
      transition: background 0.2s;
    }
    .analysis-detail-row:last-child { margin-bottom: 0; }
    .analysis-detail-row:hover { background: rgba(0,0,0,0.18); }

    .analysis-detail-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .analysis-detail-head .type-badge {
      font-size: 0.55rem;
      padding: 0.07rem 0.35rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .analysis-detail-head .analysis-count {
      font-size: 0.6rem;
      background: rgba(255,255,255,0.04);
      padding: 0.05rem 0.4rem;
      border-radius: 999px;
    }
    .analysis-pokemon-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      padding-left: 0.15rem;
    }
    .analysis-pokemon-tag {
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.2s;
    }
    .analysis-pokemon-tag:hover {
      background: rgba(255,255,255,0.08);
      transform: translateY(-1px);
    }
    .analysis-pokemon-tag span { font-size: 0.55rem; }

    .analysis-missing-cover {
      margin: 0 0.6rem 0.7rem;
      padding: 0.5rem 0.7rem;
      background: rgba(251,191,36,0.04);
      border-radius: 14px;
      border: 1px solid rgba(251,191,36,0.08);
    }
    .analysis-missing-cover .analysis-section-title {
      font-size: 0.65rem;
      color: #fbbf24;
      margin-bottom: 0.4rem;
    }
    .analysis-missing-cover .analysis-tags .type-badge {
      font-size: 0.5rem;
      padding: 0.05rem 0.3rem;
      opacity: 0.55;
    }
    .analysis-missing-cover .analysis-tags .type-badge:hover { opacity: 0.85; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .detail-modal { max-width: 500px; }
    }

    @media (max-width: 640px) {
      body { padding: 1rem 0.6rem; }
      .header { margin-bottom: 1.5rem; }
      .header h1 { font-size: clamp(0.65rem, 2vw, 0.9rem); }
      .header p { font-size: 0.75rem; }

      .back-btn { position: relative; top: auto; left: auto; margin-bottom: 0.8rem; display: inline-flex; }

      .grid { gap: 1rem; }

      .player-header { padding: 0.75rem 1rem; gap: 0.5rem; }
      .player-avatar { width: 30px; height: 30px; }
      .player-name { font-size: 0.85rem; }
      .online-badge { font-size: 0.6rem; padding: 0.2rem 0.5rem; }

      .team-grid { grid-template-columns: repeat(2, 1fr); gap: 0.4rem; padding: 0.75rem; }
      .poke-slot { padding: 0.4rem 0.3rem; }
      .poke-slot.empty { min-height: 70px; }
      .poke-img-wrap { width: 44px; height: 44px; }
      .poke-img-wrap img { width: 100%; height: 100%; }
      .poke-name { font-size: 0.6rem; }
      .poke-level { font-size: 0.55rem; }
      .poke-hp-bar { margin-top: 0.25rem; }
      .type-badge { font-size: 0.48rem; padding: 0.05rem 0.25rem; }
      .shiny-star { font-size: 0.55rem; top: -3px; right: -3px; }

      /* Detail modal */
      .detail-modal-overlay { padding: 0.6rem; align-items: flex-start; padding-top: 1rem; }
      .detail-modal { max-width: 100%; border-radius: 16px; }
      .detail-body { padding: 0.8rem 0.9rem 1rem; }
      .detail-main { grid-template-columns: 1fr; gap: 1rem; }
      .detail-sprite-section { display: flex; flex-direction: column; align-items: center; }
      .detail-sprite-wrap { width: 100px; height: 100px; }
      .detail-sprite { width: 85px; height: 85px; }
      .detail-name { font-size: 0.9rem; }
      .detail-level { font-size: 0.75rem; }
      .detail-meta { font-size: 0.72rem; }
      .detail-meta-item { flex-wrap: wrap; }

      .detail-stats-section h3, .detail-moves-section h3 { font-size: 0.8rem; }
      .detail-stat-row { grid-template-columns: 56px 1fr 30px; font-size: 0.68rem; gap: 4px; }
      .detail-stat-label { font-size: 0.68rem; }
      .detail-stat-bar { height: 10px; }
      .detail-stat-sub { font-size: 0.5rem; }
      .detail-stat-val { font-size: 0.75rem; }

      .detail-moves-grid { grid-template-columns: 1fr; gap: 4px; }
      .detail-move { font-size: 0.65rem; padding: 0.3rem 0.5rem; }
      .detail-move .type-badge { font-size: 0.5rem; padding: 0.05rem 0.25rem; }

      .eff-section { font-size: 0.7rem; }
      .eff-section .type-badge { font-size: 1.15rem; padding: 0.3rem 0.75rem; }

      /* Analysis */
      .team-analysis-btn { font-size: 0.65rem; padding: 0.35rem 0; width: calc(100% - 1.5rem); margin: 0.4rem 0.75rem 0; }
      .analysis-summary { padding: 0.5rem 0.75rem; font-size: 0.62rem; gap: 4px; }
      .analysis-summary span { padding: 0.25rem 0.5rem; font-size: 0.6rem; }
      .analysis-section { margin: 0 0.4rem 0.5rem; padding: 0.4rem 0.5rem; }
      .analysis-section-title { font-size: 0.65rem; margin-bottom: 0.35rem; }
      .analysis-detail-row { padding: 0.3rem 0.4rem; font-size: 0.6rem; }
      .analysis-count { font-size: 0.55rem; }
      .analysis-pokemon-tag { font-size: 0.6rem; padding: 0.1rem 0.35rem; }
      .analysis-pokemon-tag span { font-size: 0.5rem; }
      .analysis-missing-cover { margin: 0 0.4rem 0.5rem; padding: 0.4rem 0.5rem; }
      .analysis-missing-cover .analysis-section-title { font-size: 0.6rem; }
      .analysis-missing-cover .analysis-tags .type-badge { font-size: 0.45rem; }

      .poke-slot[data-tip]:hover::after { display: none; }
    }

    @media (max-width: 480px) {
      body { padding: 0.6rem 0.4rem; }
      .team-grid { gap: 0.3rem; padding: 0.5rem; }
      .poke-slot { padding: 0.3rem 0.2rem; }
      .poke-img-wrap { width: 36px; height: 36px; }
      .poke-name { font-size: 0.55rem; }
      .poke-level { font-size: 0.5rem; }
      .refresh-btn { font-size: 0.7rem; padding: 0.35rem 0.8rem; }

      .detail-modal-overlay { padding: 0.4rem; }
      .detail-modal { border-radius: 12px; }
      .detail-body { padding: 0.6rem 0.7rem 0.8rem; }
      .detail-sprite-wrap { width: 80px; height: 80px; }
      .detail-sprite { width: 68px; height: 68px; }
      .detail-stat-row { grid-template-columns: 48px 1fr 26px; font-size: 0.62rem; }
      .detail-stat-bar { height: 8px; }
    }

    @media (max-width: 360px) {
      .team-grid { grid-template-columns: repeat(2, 1fr); gap: 0.25rem; padding: 0.4rem; }
      .poke-img-wrap { width: 30px; height: 30px; }
      .poke-slot.empty { min-height: 52px; }
      .poke-slot .type-badge { font-size: 0.42rem; }
    }
  </style>
</body>

</html>
