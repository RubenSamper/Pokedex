<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main id="ContenedorPrincipal">
        <div id="ContenedorPokemon">
            <div class="pokedex-header">
                <div class="pokedex-logo">
                    <div class="pokeball-icon"></div>
                    <h1>Pokédex</h1>
                </div>
                <div class="header-led"></div>
            </div>
            <div class="pokedex-content">
                <div class="buscador-contenedor">
                    <input type="text" id="buscador" class="buscador" placeholder="Buscar por nombre o ID...">
                    <button id="btnClearSearch" class="btn-clear-search oculto" title="Limpiar búsqueda">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                        </svg>
                    </button>
                </div>

                <div class="toolbar">
                    <div class="toolbar-left">
                        <button id="btnFavoritos" class="toolbar-btn" title="Mostrar solo favoritos">&#9733; Favoritos</button>
                        <button id="btnComparar" class="toolbar-btn" title="Modo comparación">&#8694; Comparar</button>
                    </div>
                    <div class="toolbar-right">
                        <select id="sortSelect" class="toolbar-select">
                            <option value="id">Orden: ID</option>
                            <option value="nombre">Orden: Nombre A-Z</option>
                            <option value="nombre-desc">Orden: Nombre Z-A</option>
                            <option value="tipo">Orden: Tipo</option>
                        </select>
                        <select id="genSelect" class="toolbar-select">
                            <option value="0">Elige Generación</option>
                            <option value="1">Generación I</option>
                            <option value="2">Generación II</option>
                            <option value="3">Generación III</option>
                            <option value="4">Generación IV</option>
                            <option value="5">Generación V</option>
                            <option value="6">Generación VI</option>
                            <option value="7">Generación VII</option>
                            <option value="8">Generación VIII</option>
                            <option value="9">Generación IX</option>
                        </select>
                    </div>
                </div>

                <div id="tipoFiltros" class="tipo-filtros"></div>

                <div id="loadingIndicator" class="loading-spinner"></div>
                <div id="galeriaPokemon" class="galeria-pokemon"></div>
                <div id="noResults" class="no-resultados oculto">No se encontraron pokemon</div>
                <div id="pokemonCount" class="pokemon-count"></div>
            </div>
        </div>
    </main>

    <div id="compareBar" class="compare-bar oculto">
        <div class="compare-slots">
            <div id="compareSlot1" class="compare-slot" data-index="0">
                <span class="compare-slot-placeholder">#1</span>
            </div>
            <span class="compare-vs">VS</span>
            <div id="compareSlot2" class="compare-slot" data-index="1">
                <span class="compare-slot-placeholder">#2</span>
            </div>
        </div>
        <button id="btnCompareGo" class="compare-go oculto">Comparar</button>
        <button id="btnCompareClose" class="compare-close">&times;</button>
    </div>

    <div id="compareModal" class="modal oculto">
        <div class="modal-contenido compare-modal-content">
            <div class="modal-header">
                <div class="modal-header-led"></div>
                <div class="modal-header-bar"></div>
                <span class="cerrar comparar-cerrar">&times;</span>
            </div>
            <div id="compareBody" class="compare-body"></div>
        </div>
    </div>

    <div id="modalPokemon" class="modal oculto">
        <div class="modal-contenido">
            <div class="modal-header">
                <div class="modal-header-led"></div>
                <div class="modal-header-bar"></div>
                <button id="btnPrevPokemon" class="nav-btn" title="Anterior">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="m3.86 8.753 5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z"/>
                    </svg>
                </button>
                <button id="cerrarModalBtn" class="cerrar-btn" title="Cerrar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                        <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                    </svg>
                </button>
                <button id="btnNextPokemon" class="nav-btn" title="Siguiente">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
                    </svg>
                </button>
            </div>
            <h2 id="nombreModal"></h2>
            <div class="modal-body">
                <div class="modal-img-wrapper">
                    <img id="imgModal" alt="Pokemon">
                    <button id="btnShiny" class="btn-shiny oculto" title="Alternar shiny">&#10024;</button>
                    <button id="btnFavModal" class="btn-fav" title="Añadir a favoritos">&#9733;</button>
                </div>
                <div class="info-pokemon">
                    <p><strong>ID:</strong> <span id="idModal"></span></p>
                    <p><strong>Tipo:</strong> <span id="tipoModal"></span></p>
                    <p><strong>Altura:</strong> <span id="alturaModal"></span> m</p>
                    <p><strong>Peso:</strong> <span id="pesoModal"></span> kg</p>
                    <p><strong>Exp. base:</strong> <span id="expModal"></span></p>
                    <p><strong>Habilidades:</strong> <span id="habilidadesModal"></span></p>
                    <p><strong>Generación:</strong> <span id="genModal"></span></p>
                </div>
            </div>
            <div class="stats-seccion">
                <h3>Estadísticas base</h3>
                <div id="statsContainer"></div>
                <div class="radar-wrapper">
                    <canvas id="radarChart" width="200" height="200"></canvas>
                </div>
            </div>
            <div class="habilidades-seccion">
                <h3>Habilidades</h3>
                <div id="habilidadesContainer"></div>
            </div>
            <div class="efectividad-seccion">
                <h3>Debilidades y resistencias</h3>
                <div id="efectividadContainer"></div>
            </div>
            <div class="evoluciones-seccion">
                <h3>Evoluciones</h3>
                <div id="evolucionesContainer" class="evoluciones-lista"></div>
            </div>
            <div class="formas-seccion oculto">
                <h3>Formas alternativas</h3>
                <div id="formasContainer" class="formas-lista"></div>
            </div>
            <div class="movimientos-seccion">
                <h3>Movimientos</h3>
                <div id="movimientosContainer" class="movimientos-lista"></div>
                <div id="moveDetalle" class="move-detalle oculto">
                    <div class="move-detalle-titulo" id="moveDetalleTitulo"></div>
                    <div class="move-detalle-desc" id="moveDetalleDesc"></div>
                </div>
            </div>
            <div class="cries-seccion">
                <h3>Sonido</h3>
                <div id="criesContainer"></div>
            </div>
            <div class="descripcion-pokemon">
                <p id="descripcionModal"></p>
            </div>
        </div>
    </div>

    <script src="js/main.js" defer></script>
</body>

</html>
