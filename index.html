<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main id="ContenedorPrincipal">
        <div id="ContenedorPokemon">
            <div class="pokedex-header">
                <div class="pokedex-logo">
                    <div class="pokeball-icon"></div>
                    <h1>Pokédex</h1>
                </div>
                <div class="header-led"></div>
            </div>
            <div class="pokedex-content">
                <div class="buscador-contenedor">
                    <input type="text" id="buscador" class="buscador" placeholder="Buscar por nombre o ID...">
                </div>
                <div id="loadingIndicator" class="loading-spinner"></div>
                <div id="galeriaPokemon" class="galeria-pokemon"></div>
                <div id="noResults" class="no-resultados oculto">No se encontraron pokemon</div>
                <div id="pokemonCount" class="pokemon-count"></div>
            </div>
        </div>
    </main>

    <div id="modalPokemon" class="modal oculto">
        <div class="modal-contenido">
            <div class="modal-header">
                <div class="modal-header-led"></div>
                <div class="modal-header-bar"></div>
                <span class="cerrar">&times;</span>
            </div>
            <h2 id="nombreModal"></h2>
            <div class="modal-body">
                <div class="modal-img-wrapper">
                    <img id="imgModal" alt="Pokemon">
                    <button id="btnShiny" class="btn-shiny oculto" title="Alternar shiny">✨</button>
                </div>
                <div class="info-pokemon">
                    <p><strong>ID:</strong> <span id="idModal"></span></p>
                    <p><strong>Tipo:</strong> <span id="tipoModal"></span></p>
                    <p><strong>Altura:</strong> <span id="alturaModal"></span> m</p>
                    <p><strong>Peso:</strong> <span id="pesoModal"></span> kg</p>
                    <p><strong>Exp. base:</strong> <span id="expModal"></span></p>
                    <p><strong>Habilidades:</strong> <span id="habilidadesModal"></span></p>
                </div>
            </div>
            <div class="stats-seccion">
                <h3>Estadísticas base</h3>
                <div id="statsContainer"></div>
            </div>
            <div class="habilidades-seccion">
                <h3>Habilidades</h3>
                <div id="habilidadesContainer"></div>
            </div>
            <div class="evoluciones-seccion">
                <h3>Evoluciones</h3>
                <div id="evolucionesContainer" class="evoluciones-lista"></div>
            </div>
            <div class="movimientos-seccion">
                <h3>Movimientos</h3>
                <div id="movimientosContainer" class="movimientos-lista"></div>
                <div id="moveDetalle" class="move-detalle oculto">
                    <div class="move-detalle-titulo" id="moveDetalleTitulo"></div>
                    <div class="move-detalle-desc" id="moveDetalleDesc"></div>
                </div>
            </div>
            <div class="cries-seccion">
                <h3>Sonido</h3>
                <div id="criesContainer"></div>
            </div>
            <div class="descripcion-pokemon">
                <p id="descripcionModal"></p>
            </div>
        </div>
    </div>

    <script src="js/main.js" defer></script>
</body>

</html>
