<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipos del Servidor</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d1a;
      --card: #13132a;
      --card2: #1a1a35;
      --border: #2a2a55;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --gold: #ffd700;
      --text: #e8e8ff;
      --muted: #7070aa;
      --green: #4ade80;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.8rem, 2.5vw, 1.2rem);
      color: var(--accent);
      text-shadow: 0 0 20px rgba(108,99,255,0.5);
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.5rem 1.2rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .last-update {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .player-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeIn 0.4s ease both;
    }
    .player-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(108,99,255,0.15);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .player-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.2rem;
      background: var(--card2);
      border-bottom: 1px solid var(--border);
    }

    .player-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--border);
      overflow: hidden;
      flex-shrink: 0;
    }
    .player-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .player-name {
      font-weight: 700;
      font-size: 1rem;
      flex: 1;
    }

    .online-badge {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
    }
    .online-badge.online { background: rgba(74,222,128,0.12); color: var(--green); }
    .online-badge.offline { background: rgba(248,113,113,0.12); color: var(--red); }
    .online-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .online-badge.online .dot { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      padding: 1rem;
    }

    .poke-slot {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 0.4rem;
      text-align: center;
      transition: border-color 0.2s;
      cursor: default;
      position: relative;
    }
    .poke-slot:hover { border-color: var(--accent); }

    .poke-slot.empty {
      opacity: 0.3;
      min-height: 90px;
    }

    .poke-img-wrap {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.3rem;
      position: relative;
    }
    .poke-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    .shiny-star {
      position: absolute;
      top: -4px;
      right: -4px;
      font-size: 0.65rem;
    }

    .poke-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .poke-level {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .poke-hp-bar {
      height: 3px;
      background: var(--border);
      border-radius: 999px;
      margin-top: 0.4rem;
      overflow: hidden;
    }
    .poke-hp-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }
    .hp-high { background: var(--green); }
    .hp-mid { background: var(--gold); }
    .hp-low { background: var(--red); }

    .empty-team {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--muted);
    }
    .loading-dots span {
      display: inline-block;
      animation: bounce 1.2s infinite;
      font-size: 2rem;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    .error-msg {
      text-align: center;
      padding: 3rem;
      color: var(--red);
      font-size: 0.9rem;
    }

    /* Tooltip */
    .poke-slot[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e40;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: 0.65rem;
      white-space: nowrap;
      color: var(--text);
      z-index: 10;
      pointer-events: none;
    }

    /* TYPE COLORS */
    .type-badge {
      display: inline-block;
      font-size: 0.55rem;
      font-weight: 700;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 0.2rem;
    }
    .type-fire    { background: #f08030; color: #fff; }
    .type-water   { background: #6890f0; color: #fff; }
    .type-grass   { background: #78c850; color: #fff; }
    .type-electric{ background: #f8d030; color: #333; }
    .type-psychic { background: #f85888; color: #fff; }
    .type-ice     { background: #98d8d8; color: #333; }
    .type-dragon  { background: #7038f8; color: #fff; }
    .type-dark    { background: #705848; color: #fff; }
    .type-fairy   { background: #ee99ac; color: #333; }
    .type-normal  { background: #a8a878; color: #fff; }
    .type-fighting{ background: #c03028; color: #fff; }
    .type-flying  { background: #a890f0; color: #fff; }
    .type-poison  { background: #a040a0; color: #fff; }
    .type-ground  { background: #e0c068; color: #333; }
    .type-rock    { background: #b8a038; color: #fff; }
    .type-bug     { background: #a8b820; color: #fff; }
    .type-ghost   { background: #705898; color: #fff; }
    .type-steel   { background: #b8b8d0; color: #333; }
  </style>
</head>
<body>

<div class="header">
  <h1>⚔ EQUIPOS DEL SERVIDOR</h1>
  <p>La casa del Girona — Cobblemon 1.21.1</p>
  <button class="refresh-btn" onclick="loadTeams(true)" id="refreshBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M23 4v6h-6M1 20v-6h6"/>
      <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
    </svg>
    Actualizar
  </button>
  <span class="last-update" id="lastUpdate"></span>
</div>

<div id="root"></div>

<script>
const SERVER_ID = '6a16d56a9bd4b6296506e1d7';
const API_URL = `https://cobblemonextras.com/api/showcase/${SERVER_ID}`;

// Tipos de Pokémon desde PokeAPI (caché local)
const typeCache = {};

async function getPokemonData(name) {
  const key = name.toLowerCase().replace(/[^a-z0-9-]/g, '');
  if (typeCache[key]) return typeCache[key];
  try {
    const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${key}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    const result = {
      types: data.types.map(t => t.type.name),
      sprite: data.sprites.front_default,
      id: data.id
    };
    typeCache[key] = result;
    return result;
  } catch {
    return { types: [], sprite: null, id: null };
  }
}

function getSpriteUrl(pokemonName, isShiny = false) {
  const key = pokemonName.toLowerCase().replace(/[^a-z0-9-]/g, '');
  if (typeCache[key]?.id) {
    const id = typeCache[key].id;
    if (isShiny) return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${id}.png`;
    return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
  }
  return `https://img.pokemondb.net/sprites/sword-shield/icon/${key}.png`;
}

function getHpClass(pct) {
  if (pct > 50) return 'hp-high';
  if (pct > 20) return 'hp-mid';
  return 'hp-low';
}

function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}

async function renderTeams(data) {
  const root = document.getElementById('root');

  if (!data || data.length === 0) {
    root.innerHTML = `<div class="error-msg">No hay jugadores con Showcase activo aún.<br><small style="color:var(--muted)">Pide a tus amigos que ejecuten /showcase on</small></div>`;
    return;
  }

  // Pre-fetch tipos en paralelo
  const allPokemon = data.flatMap(p => (p.party || p.pokemon || p.team || []).map(pk => pk.species || pk.name || ''));
  await Promise.all([...new Set(allPokemon)].map(name => name ? getPokemonData(name) : null));

  const grid = document.createElement('div');
  grid.className = 'grid';

  for (const player of data) {
    const party = player.party || player.pokemon || player.team || [];
    const isOnline = player.online !== false;
    const username = player.username || player.player || player.name || 'Jugador';

    const card = document.createElement('div');
    card.className = 'player-card';
    card.style.animationDelay = `${data.indexOf(player) * 0.08}s`;

    // Header
    const avatarUrl = `https://mc-heads.net/avatar/${username}/36`;
    card.innerHTML = `
      <div class="player-header">
        <div class="player-avatar">
          <img src="${avatarUrl}" alt="${username}" onerror="this.src='https://mc-heads.net/avatar/steve/36'">
        </div>
        <span class="player-name">${username}</span>
        <span class="online-badge ${isOnline ? 'online' : 'offline'}">
          <span class="dot"></span>${isOnline ? 'Online' : 'Offline'}
        </span>
      </div>
    `;

    // Team
    if (party.length === 0) {
      card.innerHTML += `<div class="empty-team">Sin Pokémon en el equipo</div>`;
    } else {
      const teamGrid = document.createElement('div');
      teamGrid.className = 'team-grid';

      // Siempre 6 slots
      for (let i = 0; i < 6; i++) {
        const slot = document.createElement('div');
        slot.className = 'poke-slot';

        if (i < party.length) {
          const pk = party[i];
          const pkName = pk.species || pk.name || pk.pokemon || 'unknown';
          const pkLevel = pk.level || pk.lvl || '?';
          const isShiny = pk.shiny || false;
          const currentHp = pk.currentHealth ?? pk.hp ?? pk.currentHp ?? null;
          const maxHp = pk.maxHealth ?? pk.maxHp ?? null;
          const hpPct = (currentHp !== null && maxHp) ? Math.round((currentHp / maxHp) * 100) : 100;

          const pokeData = typeCache[pkName.toLowerCase()] || {};
          const spriteUrl = getSpriteUrl(pkName, isShiny);
          const types = pokeData.types || [];

          const tipText = `Nv.${pkLevel}${isShiny ? ' ✨' : ''}${currentHp !== null ? ` · ${Math.round(currentHp)}/${maxHp} HP` : ''}`;
          slot.setAttribute('data-tip', tipText);

          slot.innerHTML = `
            <div class="poke-img-wrap">
              <img src="${spriteUrl}" alt="${pkName}" onerror="this.style.opacity='0.3'">
              ${isShiny ? '<span class="shiny-star">✨</span>' : ''}
            </div>
            <div class="poke-name">${capitalize(pkName)}</div>
            <div class="poke-level">Nv. ${pkLevel}</div>
            ${types.length ? `<span class="type-badge type-${types[0]}">${types[0]}</span>` : ''}
            ${currentHp !== null ? `
              <div class="poke-hp-bar">
                <div class="poke-hp-fill ${getHpClass(hpPct)}" style="width:${hpPct}%"></div>
              </div>
            ` : ''}
          `;
        } else {
          slot.classList.add('empty');
          slot.innerHTML = `<div style="height:56px;width:56px;margin:0 auto"></div>`;
        }

        teamGrid.appendChild(slot);
      }

      card.appendChild(teamGrid);
    }

    grid.appendChild(card);
  }

  root.innerHTML = '';
  root.appendChild(grid);
}

async function loadTeams(manual = false) {
  const btn = document.getElementById('refreshBtn');
  const root = document.getElementById('root');

  btn.classList.add('spinning');

  if (!root.querySelector('.grid')) {
    root.innerHTML = `
      <div class="loading">
        <div class="loading-dots">
          <span>●</span><span>●</span><span>●</span>
        </div>
        <p style="margin-top:1rem;font-size:0.8rem">Cargando equipos...</p>
      </div>`;
  }

  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    console.log('CobblemonExtras API response:', data);
    
    // La API puede devolver { players: [...] } o directamente [...]
    const players = Array.isArray(data) ? data : (data.players || data.data || []);
    await renderTeams(players);

    const now = new Date();
    document.getElementById('lastUpdate').textContent =
      `Última actualización: ${now.toLocaleTimeString('es-ES')}`;
  } catch (err) {
    console.error('Error fetching teams:', err);
    root.innerHTML = `
      <div class="error-msg">
        ❌ No se pudieron cargar los equipos<br>
        <small style="color:var(--muted);display:block;margin-top:0.5rem">${err.message}</small>
        <small style="color:var(--muted)">Comprueba la consola del navegador para más detalles</small>
      </div>`;
  } finally {
    btn.classList.remove('spinning');
  }
}

// Carga inicial
loadTeams();
// Auto-refresh cada 2 minutos
setInterval(() => loadTeams(), 2 * 60 * 1000);
</script>
</body>
</html>
